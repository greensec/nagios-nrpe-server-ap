# This is a basic workflow that is manually triggered

name: build package
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        type: choice
        description: 'Debian/Ubuntu Version'
        options:
          - 'bullseye'
          - 'bookworm'
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/${{ github.repository_owner }}/custom-deb-build:${{ github.event.inputs.flavor }}"
      options: --privileged --device /dev/fuse
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache build
        uses: actions/cache@v3
        with:
          path: |
            cache
          key: "${{ github.event.inputs.flavor }}-build-cache-${{ github.event.inputs.hb_tag }}"
          restore-keys: |
            "${{ github.event.inputs.flavor }}-build-cache-"
      - name: Run build script
        run: ./scripts/build.sh
        env:
          DEB_FLAVOR: "${{ github.event.inputs.flavor }}"
      - name: Upload deb files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./*.deb
