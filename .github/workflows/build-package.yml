# This is a basic workflow that is manually triggered

name: build package
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        description: "Debian/Ubuntu flavor (e.g. debian:trixie, ubuntu:noble)"
        default: "debian:trixie"
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate flavor
        run: |
          set -eu
          flavor="${{ inputs.flavor }}"
          if ! grep -qx "${flavor}" .github/supported-releases.txt; then
            echo "Unsupported flavor: ${flavor}"
            echo "Supported flavors:"
            cat .github/supported-releases.txt
            exit 1
          fi
      - name: Prepare and build inside target container
        # docker CLI rather than a job container: node20-based actions
        # require glibc >= 2.28, which EOL images (jessie/stretch) lack.
        run: |
          set -eu
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ inputs.flavor }}" \
            bash -c './scripts/ci/setup-build-env.sh && ./scripts/build.sh && ./scripts/test/smoke.sh'
      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: packages
          # only the renamed server package; the byproduct
          # nagios-nrpe-plugin deb must not shadow the distro package
          path: ./nagios-nrpe-server-ap_*.deb
          if-no-files-found: error
