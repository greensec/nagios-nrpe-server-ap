# This is a basic workflow that is manually triggered

name: build package
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        description: "Debian/Ubuntu flavor (e.g. debian:trixie, ubuntu:noble)"
        default: "debian:trixie"
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: "${{ inputs.flavor }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Validate flavor
        run: |
          set -eu
          flavor="${{ inputs.flavor }}"
          if ! grep -qx "${flavor}" .github/supported-releases.txt; then
            echo "Unsupported flavor: ${flavor}"
            echo "Supported flavors:"
            cat .github/supported-releases.txt
            exit 1
          fi
      - name: Prepare build environment
        run: ./scripts/ci/setup-build-env.sh
      - name: Run build script
        run: ./scripts/build.sh
      - name: Upload deb files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./*.deb
