# This is a basic workflow that is manually triggered

name: build package
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        type: choice
        description: 'Debian/Ubuntu Version'
        options:
          - 'bullseye'
          - 'bookworm'
          - 'trixie'
          - 'noble'
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: "${{ github.event.inputs.flavor == 'noble' && 'ubuntu:noble' || format('debian:{0}', github.event.inputs.flavor) }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare build environment
        run: ./scripts/ci/setup-build-env.sh
      - name: Run build script
        run: ./scripts/build.sh
      - name: Upload deb files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./*.deb
