# This is a basic workflow that is manually triggered

name: build package release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        type: choice
        description: 'Debian/Ubuntu Version'
        options:
          - 'bullseye'
          - 'bookworm'
        required: true
      release:
        type: boolean
        description: "publish to repository"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/${{ github.repository_owner }}/custom-deb-build:${{ github.event.inputs.flavor }}"
      options: --privileged --device /dev/fuse
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            cache
          key: "${{ github.event.inputs.flavor }}-build-cache-${{ github.event.inputs.hb_tag }}"
          restore-keys: |
            "${{ github.event.inputs.flavor }}-build-cache-"
      - name: Run build script
        run: ./scripts/build.sh
        env:
          DEB_FLAVOR: "${{ github.event.inputs.flavor }}"
      - name: Upload deb files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./*.deb
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./*.deb
      - name: Github pages APT repo
        uses: smeinecke/apt-repo-action@master
        if: github.event.inputs.release == true
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo_supported_arch: amd64
          repo_supported_version: |
            bookworm
            bullseye
          file: |
            nagios-nrpe-server~${{ github.event.inputs.flavor }}_amd64.deb
          file_target_version: ${{ github.event.inputs.flavor }}
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
