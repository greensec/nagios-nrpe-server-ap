# This is a basic workflow that is manually triggered

name: build package release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        description: "Debian/Ubuntu flavor (e.g. debian:trixie, ubuntu:noble)"
        default: "debian:trixie"
        required: true
      release:
        type: boolean
        description: "publish to repository"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: "${{ inputs.flavor }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate flavor and extract codename
        run: |
          set -eu
          flavor="${{ inputs.flavor }}"
          if ! grep -qx "${flavor}" .github/supported-releases.txt; then
            echo "Unsupported flavor: ${flavor}"
            echo "Supported flavors:"
            cat .github/supported-releases.txt
            exit 1
          fi
          echo "debian_release=${flavor##*:}" >> "$GITHUB_ENV"
      - name: Load repo supported versions
        id: releases
        run: |
          set -eu
          repo_versions="$(cut -d: -f2 .github/supported-releases.txt)"
          {
            echo "repo_versions<<EOF"
            printf '%s\n' "${repo_versions}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare build environment
        run: ./scripts/ci/setup-build-env.sh
      - name: Run build script
        run: ./scripts/build.sh
      - name: Upload deb files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./*.deb
      - name: Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') && github.event.inputs.release == 'true')
        with:
          files: ./*.deb
      - name: Github pages APT repo
        uses: smeinecke/apt-repo-action@v2.1.8
        if: github.event.inputs.release == 'true'
        with:
          github_token: ${{ github.token }}
          repo_supported_arch: amd64
          repo_supported_version: ${{ steps.releases.outputs.repo_versions }}
          file: |
            *.deb
          file_target_version: ${{ env.debian_release }}
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
