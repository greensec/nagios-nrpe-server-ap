# This is a basic workflow that is manually triggered

name: build package release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      flavor:
        type: choice
        description: 'Debian/Ubuntu Version'
        options:
          - 'bullseye'
          - 'bookworm'
          - 'trixie'
          - 'noble'
        required: true
      release:
        type: boolean
        description: "publish to repository"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: "${{ github.event.inputs.flavor == 'noble' && 'ubuntu:noble' || format('debian:{0}', github.event.inputs.flavor) }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare build environment
        run: ./scripts/ci/setup-build-env.sh
      - name: Run build script
        run: ./scripts/build.sh
      - name: Upload deb files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./*.deb
      - name: Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') && github.event.inputs.release == 'true')
        with:
          files: ./*.deb
      - name: Github pages APT repo
        uses: smeinecke/apt-repo-action@master
        if: github.event.inputs.release == 'true'
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo_supported_arch: amd64
          repo_supported_version: |
            noble
            trixie
            bookworm
            bullseye
          file: |
            *.deb
          file_target_version: ${{ github.event.inputs.flavor }}
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
