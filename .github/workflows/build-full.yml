name: build full release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      os_matrix: ${{ steps.releases.outputs.os_matrix }}
      repo_versions: ${{ steps.releases.outputs.repo_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Load Supported Releases
        id: releases
        run: |
          set -eu
          mapfile -t releases < <(grep -E '^[a-z]+(/[a-z]+)?:[a-z0-9]+$' .github/supported-releases.txt)
          if [ "${#releases[@]}" -eq 0 ]; then
            echo "No supported releases found in .github/supported-releases.txt"
            exit 1
          fi

          os_matrix="$(printf '%s\n' "${releases[@]}" | jq -R . | jq -s -c .)"
          repo_versions="$(printf '%s\n' "${releases[@]}" | cut -d: -f2)"

          echo "os_matrix=${os_matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "repo_versions<<EOF"
            printf '%s\n' "${repo_versions}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build packages
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os-version: ${{ fromJson(needs.prepare.outputs.os_matrix) }}
        arch: [amd64]
        # native arm64 builds on the arm runner; multiarch docker images
        # pull the matching variant automatically (no qemu needed)
        include:
          - os-version: debian:bookworm
            arch: arm64
          - os-version: debian:trixie
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract release codename
        run: |
          os_version="${{ matrix.os-version }}"
          echo "debian_release=${os_version##*:}" >> "$GITHUB_ENV"
      - name: Prepare and build inside target container
        # The build runs via docker CLI rather than a job container:
        # node20-based actions require glibc >= 2.28, which the EOL
        # images (jessie/stretch) do not provide.
        run: |
          set -eu
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.os-version }}" \
            bash -c './scripts/ci/setup-build-env.sh && ./scripts/build.sh && ./scripts/test/smoke.sh'
      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.debian_release }}-${{ matrix.arch }}
          # only the renamed server package; the byproduct
          # nagios-nrpe-plugin deb must not shadow the distro package
          path: ./nagios-nrpe-server-ap_*.deb
          if-no-files-found: error

  merge-artefacts:
    name: Merge all deb files to single artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: debian-packages
        uses: actions/upload-artifact/merge@v7
        with:
          name: merged-artifacts
          pattern: packages-*

  add_release:
    name: Add package to release
    needs: merge-artefacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: merged-artifacts
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./*.deb

  add_repo:
    name: Add packages to public debian repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - merge-artefacts
      - prepare
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: "merged-artifacts"
      - name: Add releases to repo
        uses: smeinecke/apt-repo-action@v2.2.1
        with:
          github_token: ${{ github.token }}
          repo_supported_arch: |
            amd64
            arm64
          repo_supported_version: ${{ needs.prepare.outputs.repo_versions }}
          file: |
            *.deb
          version_by_filename: true
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
          skip_duplicates: true
